[workspace]
resolver = "2"
members = ["crates/bird-core", "crates/bird-cli"]

[workspace.package]
version = "2.1.1"
edition = "2021"
license = "MIT"
authors = ["Zigmoon"]
description = "Bird — moteur vectoriel et outils natifs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
