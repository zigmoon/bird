name: Build Bird — web, Rust, desktop (macOS · Windows · Linux)

# Trois familles d'artefacts, trois runners.
#
# Windows ne peut pas fabriquer un .dmg et macOS ne peut pas fabriquer un
# .msi : ces binaires ne peuvent naître que sur leur propre système. C'est
# le seul endroit où les trois plateformes de bureau sont produites.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Le moteur web doit compiler avant qu'on emballe quoi que ce soit.
  # ─────────────────────────────────────────────────────────────
  web:
    name: Site Astro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - name: Installer
        working-directory: astro
        run: npm ci

      # Avant de compiler quoi que ce soit : les invariants d'interface.
      # Deux régressions invisibles sont déjà passées en production — une
      # icône blanche sur fond blanc, un logo « white » en réalité sombre.
      - name: Contrôles d'invariants UI
        run: node scripts/check-ui.mjs

      - name: Compiler
        working-directory: astro
        run: npm run build
      - name: Vérifier que le shell éditeur charge tous les scripts du moteur
        working-directory: astro
        run: |
          set -e
          # Bibliothèques chargées à la demande : elles n'ont pas à figurer
          # dans l'ordre de chargement initial.
          lazy="eps-import.js jspdf.umd.min.js pdf.min.js pdf.worker.min.js svg2pdf.umd.min.js"
          missing=0
          for path in public/assets/bird/js/*.js; do
            base=$(basename "$path")
            case " $lazy " in *" $base "*) continue;; esac
            if ! grep -q "$base" src/generated/editor-scripts.html; then
              echo "::error::$base n'est pas chargé par editor.astro"
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo "Tous les scripts du moteur sont chargés."

  # ─────────────────────────────────────────────────────────────
  # 2. Le cœur Rust : tests et lint, sur les trois OS.
  # ─────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Tests
        working-directory: rust
        run: cargo test --workspace
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: La CLI fonctionne
        working-directory: rust
        shell: bash
        run: |
          cargo run -q -p bird-cli -- inspect examples/sample.plume
          cargo run -q -p bird-cli -- to-svg examples/sample.plume out.svg
          test -s out.svg

  # ─────────────────────────────────────────────────────────────
  # 3. Application de bureau : un installeur par système.
  # ─────────────────────────────────────────────────────────────
  desktop:
    name: Bureau — ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS Apple Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS Intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64

    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Installer la CLI Tauri
        working-directory: desktop
        run: npm ci

      - name: Générer les icônes (ico / icns / png)
        working-directory: desktop
        run: npx tauri icon ../icons/icon-512.png

      - name: Assembler le moteur web
        working-directory: desktop
        run: node scripts/stage.mjs

      - name: Compiler l'application et ses installeurs
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }}

      - name: Vérifier que les installeurs existent
        shell: bash
        working-directory: desktop
        run: |
          set -e
          dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$dir" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -exec ls -lh {} \;
          count=$(find "$dir" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) | wc -l)
          echo "Installeurs produits : $count"
          test "$count" -ge 1

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: bird-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  # ─────────────────────────────────────────────────────────────
  # 4. Release : les installeurs attachés au tag.
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Les artefacts arrivent dans un dossier par cible. On les aplatit :
      # une release doit se lire, pas se défricher.
      - name: Aplatir les artefacts
        run: |
          set -e
          mkdir -p release
          find artifacts -type f \( \
            -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0 |
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              # Une même release ne peut pas contenir deux fois le même nom.
              if [ -e "release/$base" ]; then
                base="${base%.*}-$(echo "$f" | cut -d/ -f2).${base##*.}"
              fi
              cp "$f" "release/$base"
            done
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          name: Bird ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          body: |
            ## Télécharger Bird

            | Système | Fichier | Notes |
            |---|---|---|
            | **macOS** (Apple Silicon M1–M4) | `Bird_*_aarch64.dmg` | Ouvrir le `.dmg`, glisser Bird dans Applications |
            | **macOS** (Intel) | `Bird_*_x64.dmg` | idem |
            | **Windows** | `Bird_*_x64-setup.exe` ou `Bird_*_x64_fr-FR.msi` | L'exe NSIS est le plus simple |
            | **Linux** | `Bird_*_amd64.AppImage` | `chmod +x Bird_*.AppImage` puis exécution — aucune installation |
            | **Linux** (Debian/Ubuntu) | `Bird_*_amd64.deb` | `sudo apt install ./Bird_*.deb` |
            | **Linux** (Fedora) | `Bird-*-1.x86_64.rpm` | `sudo dnf install ./Bird-*.rpm` |

            ### Raccourcis
            Les raccourcis suivent Adobe (Illustrator) et Figma : `Ctrl` sur Windows et
            Linux, `⌘` sur macOS. Ils sont portés par le **menu système**, donc actifs
            même quand le plan de travail n'a pas le focus. `F1` affiche la liste complète.

            ### Versions sans installation
            Le même moteur tourne dans le navigateur : clonez le dépôt et ouvrez
            `index.html`, ou `npm run dev` dans `astro/`.

            > Les paquets ne sont pas signés ni notariés (pas de certificat Apple ni de
            > clé Windows dans ce dépôt). macOS peut demander un clic droit → *Ouvrir*
            > au premier lancement ; Windows peut afficher SmartScreen.
