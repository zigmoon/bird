[package]
name = "bird-desktop"
version = "2.5.0"
description = "Bird — éditeur vectoriel local-first (coquille native)"
authors = ["Zigmoon"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Le dialogue natif (ouvrir / enregistrer) est le seul plug-in gardé : la
# lecture et l'écriture passent par nos propres commandes Rust, ce qui évite
# toute configuration de portée `fs` et retire une dépendance du binaire.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
